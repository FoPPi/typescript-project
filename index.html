<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Постачальник даних - JSON Placeholder</title>
    <link rel="stylesheet" href="src/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">📱 Data Viewer</h1>
            <button id="toggleTheme" class="theme-btn">🌙 Темна тема</button>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <h2>Переглядайте дані з JSON Placeholder</h2>
            <p>Інтерактивна платформа для роботи з тестовими даними</p>
        </div>
    </section>

    <!-- Posts Section -->
    <section class="section" id="postsSection">
        <div class="container">
            <div class="section-header">
                <h2>📝 Пости</h2>
                <button id="loadPostsBtn" class="btn btn-primary">Завантажити пости</button>
            </div>
            <div id="postsList" class="posts-grid"></div>
        </div>
    </section>

    <!-- Users Section -->
    <section class="section" id="usersSection">
        <div class="container">
            <div class="section-header">
                <h2>👥 Користувачі</h2>
                <button id="loadUsersBtn" class="btn btn-primary">Завантажити користувачів</button>
            </div>
            <div id="usersList" class="users-grid"></div>
        </div>
    </section>

    <!-- Comments Section -->
    <section class="section" id="commentsSection">
        <div class="container">
            <div class="section-header">
                <h2>💬 Коментарі</h2>
                <button id="loadCommentsBtn" class="btn btn-primary">Завантажити коментарі</button>
            </div>
            <div id="commentsList" class="comments-list"></div>
        </div>
    </section>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2024 Data Viewer. Всі права захищені.</p>
    </footer>

    <script src="dist/index.js"></script>
</body>
</html>
